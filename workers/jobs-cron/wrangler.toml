# JOBS 알림 크론 — Cloudflare Pages Functions 는 Cron Trigger 를 지원하지 않아
# 이 작은 Worker 가 10분마다 POST /api/jobs/cron/run 을 호출한다. (Workers 무료 플랜으로 충분 [확인 필요: 계정 크론 개수 한도])
# 배포 (한 번만):
#   cd workers/jobs-cron
#   npx wrangler deploy
#   npx wrangler secret put CRON_SECRET     # Pages 의 JOBS_CRON_SECRET 과 같은 값
name = "jobs-cron"
main = "index.js"
compatibility_date = "2026-02-17"

[triggers]
crons = ["*/10 * * * *"]

[vars]
# [확인 필요] 운영 도메인 확정 후 교체 (예: https://www.frameplus.kr/api/jobs/cron/run)
TARGET_URL = "https://frameplus-erp.pages.dev/api/jobs/cron/run"
