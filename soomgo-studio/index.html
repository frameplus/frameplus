<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숨고 상담 스튜디오 — 관리 화면 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="주 메뉴">
    <div class="brand"><b>숨고 상담 스튜디오</b><span id="brand-co"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="linkstate" id="linkstate"></div>
      <label class="switch" style="padding:0 4px"><input type="checkbox" id="auto-master" checked><i></i><span>자동응대</span></label>
      <p class="proto">프로토타입입니다. 목업 데이터이며 숨고 연동·발송·저장은 동작하지 않습니다.</p>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="btn ghost icon" id="menu-btn" aria-label="메뉴 열기"></button>
      <b id="topbar-title"></b>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
